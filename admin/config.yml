- name: aktionswochen
  label: Aktionswochen der Bergbahnen
  description: Die Winter-Aktionen der Bad Kleinkirchheimer Bergbahnen (Ski-Opening, Kinderskipass usw.). Erscheinen auf der Winterseite, unter „Angebote & Packages“ und als Karte auf der Startseite. Die Zeitleiste zeichnet sich aus den Daten von selbst.
  editor:
    preview: false
  files:
  - name: aktionswochen
    label: Aktionswochen der Bergbahnen
    file: _data/aktionswochen.json
    fields:
    - label: Saison
      name: saison
      widget: string
      hint: z. B. „2027/28“ – erscheint in Überschrift und Startseiten-Karte.
    - label: Saisonende der Bergbahnen
      name: saisonende
      widget: datetime
      format: YYYY-MM-DD
      date_format: DD.MM.YYYY
      time_format: false
      hint: Ende der Zeitleiste. Angebote ohne „Bis“-Datum laufen bis hierher.
    - label: Angebote
      name: angebote
      widget: list
      label_singular: Angebot
      collapsed: true
      min: 1
      summary: '{{fields.kennzeichen}} · {{fields.titel}}'
      fields:
      - label: Kennzeichen
        name: kennzeichen
        widget: string
        required: false
        hint: Kurz und groß dargestellt, z. B. „3 = 2“, „1 €“, „−30 %“
      - { label: Titel, name: titel, widget: string }
      - label: Kurzname für die Zeitleiste
        name: kurzname
        widget: string
        hint: Ein bis zwei Wörter, z. B. „Ski-Wellness“
      - label: Zeiträume
        name: zeitraeume
        widget: list
        label_singular: Zeitraum
        min: 1
        summary: '{{fields.von | date(''DD.MM.YYYY'')}} – {{fields.bis | date(''DD.MM.YYYY'')}}'
        hint: Mehrere Zeiträume möglich. Beim letzten Zeitraum „Bis“ leer lassen = bis Saisonende.
        fields:
        - label: Von
          name: von
          widget: datetime
          format: YYYY-MM-DD
          date_format: DD.MM.YYYY
          time_format: false
        - label: Bis
          name: bis
          widget: datetime
          format: YYYY-MM-DD
          date_format: DD.MM.YYYY
          time_format: false
          required: false
          default: ''
      - label: Leistungen
        name: punkte
        widget: list
        label_singular: Leistung
        summary: '{{fields.punkt}}'
        hint: Eine Leistung = ein Satz. Bei nur einer Leistung erscheint sie als Absatz.
        fields:
        - { label: Leistung, name: punkt, widget: text }
      - label: Englisch
        name: en
        widget: object
        collapsed: true
        required: false
        hint: Leere Felder werden auf Deutsch angezeigt.
        fields:
        - { label: Kennzeichen, name: kennzeichen, widget: string, required: false }
        - { label: Titel, name: titel, widget: string, required: false }
        - { label: Kurzname für die Zeitleiste, name: kurzname, widget: string, required: false }
        - label: Leistungen
          name: punkte
          widget: list
          required: false
          summary: '{{fields.punkt}}'
          hint: Leer lassen = deutsche Leistungen. Wenn ausgefüllt, bitte alle übersetzen.
          fields:
          - { label: Leistung, name: punkt, widget: text }
      - label: Italienisch
        name: it
        widget: object
        collapsed: true
        required: false
        hint: Leere Felder werden auf Deutsch angezeigt.
        fields:
        - { label: Kennzeichen, name: kennzeichen, widget: string, required: false }
        - { label: Titel, name: titel, widget: string, required: false }
        - { label: Kurzname für die Zeitleiste, name: kurzname, widget: string, required: false }
        - label: Leistungen
          name: punkte
          widget: list
          required: false
          summary: '{{fields.punkt}}'
          hint: Leer lassen = deutsche Leistungen. Wenn ausgefüllt, bitte alle übersetzen.
          fields:
          - { label: Leistung, name: punkt, widget: text }
    - label: Einleitung auf der Winterseite
      name: einleitung_winter
      widget: text
    - label: Einleitung auf der Seite „Angebote & Packages“
      name: einleitung_angebote
      widget: text
    - label: Text auf der Startseite
      name: startseite_text
      widget: text
      hint: Ein Satz für die Karte „Aktionswochen der Bergbahnen“ auf der Startseite.
    - label: Hinweis unter den Angeboten
      name: hinweis
      widget: text
      required: false
      hint: 'Kleingedrucktes. Ein Link im Text: [badkleinkirchheim.com](https://www.badkleinkirchheim.com/…)'
    - label: Englisch
      name: en
      widget: object
      collapsed: true
      required: false
