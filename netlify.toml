# Haus Sonnblick – Karibu Studio
# Bei jedem Speichern im Admin-Bereich (/admin) schreibt das Skript die Inhalte
# aus _data/ in die Seiten. Schlägt die Prüfung fehl, bleibt die bisherige
# Version online (Meldung im Netlify-Deploy-Log).
[build]
  command = "node _cms/build.mjs"
  publish = "."

[build.environment]
  NODE_VERSION = "22"

# Formular-Anfragen per E-Mail ans Hotel (netlify/functions/submission-created.mjs)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/_data/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Interne Dateien nicht ausliefern
[[redirects]]
  from = "/_cms/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# Online-Buchung (feratel booking&more) – alle „Buchen“-Buttons der Website
# zeigen auf diese Adressen. Ändert sich der Buchungslink, nur hier anpassen.
[[redirects]]
  from = "/online-buchen"
  to = "https://direct.bookingandmore.com/accommodation/1e0c3a11-3899-4e10-b2c0-a07bb2e85c2f?lang=de"
  status = 302
  force = true

[[redirects]]
  from = "/en/online-buchen"
  to = "https://direct.bookingandmore.com/accommodation/1e0c3a11-3899-4e10-b2c0-a07bb2e85c2f?lang=en"
  status = 302
  force = true

[[redirects]]
  from = "/it/online-buchen"
  to = "https://direct.bookingandmore.com/accommodation/1e0c3a11-3899-4e10-b2c0-a07bb2e85c2f?lang=it"
  status = 302
  force = true
